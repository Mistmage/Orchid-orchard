[workspace]
resolver = "2"
members = [
    "crates/lilac-core",
    "crates/lilac-host",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Mistmage"]
repository = "https://github.com/Mistmage/Orchid-orchard"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
slug = "0.1"
tempfile = "3"
