<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orchard</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #1e1e2e; color: #cdd6f4; }
    .card { background: #181825; border: 1px solid #45475a; border-radius: 8px; padding: 10px; margin-bottom: 8px; cursor: pointer; }
    .title { font-weight: 600; }
    .meta { font-size: 12px; color: #a6adc8; margin-top: 4px; }
    .tags { font-size: 12px; color: #89b4fa; margin-top: 4px; }
    .blk { padding: 4px; border: 1px solid #45475a; border-radius: 4px; margin: 2px 0; cursor: text; }
    .blkcontent { white-space: pre-wrap; font-size: 13px; }
    .blkedit { display: none; width: 100%; min-height: 60px; background: #313244; color: #cdd6f4; border: 1px solid #45475a; border-radius: 4px; font-family: monospace; }
    header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
    h1 { font-size: 20px; margin: 0; }
    input { padding: 6px 10px; border-radius: 6px; border: 1px solid #45475a; background: #313244; color: #cdd6f4; width: 320px; }
    .blocks { margin-top: 8px; }
    footer { margin-top: 8px; font-size: 12px; color: #a6adc8; }
    @media (prefers-color-scheme: light) {
      body { background: #eff1f5; color: #4c4f69; }
      .card { background: #e6e9ef; border-color: #bcc0cc; }
      .meta { color: #6c6f85; }
      input { background: #e6e9ef; color: #4c4f69; border-color: #bcc0cc; }
      .blk { border-color: #bcc0cc; }
      .blkedit { background: #e6e9ef; color: #4c4f69; border-color: #bcc0cc; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
