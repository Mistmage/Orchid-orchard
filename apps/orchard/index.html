<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <title>Orchard</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #1e1e2e;
      --panel: #181825;
      --surface: #313244;
      --surface-2: #45475a;
      --text: #cdd6f4;
      --muted: #a6adc8;
      --accent: #89b4fa;
      --accent-2: #cba6f7;
      --ok: #a6e3a1;
      --danger: #f38ba8;
      --border: #45475a;
    }
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: var(--bg); color: var(--text); }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 8px; cursor: pointer; }
    .card:hover { border-color: #585b70; }
    .title { font-weight: 600; }
    .meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .tags { font-size: 12px; color: var(--accent); margin-top: 4px; }
    .card-head { display: flex; align-items: center; gap: 8px; }
    .card-head .title { flex: 1; min-width: 0; }
    .select-box { width: 16px; height: 16px; padding: 0; margin: 0; flex: 0 0 auto; accent-color: var(--accent); cursor: pointer; }
    .folder-badge { font-size: 11px; color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); padding: 1px 7px; border-radius: 999px; white-space: nowrap; }
    .list-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); margin-top: 12px; }
    .list-tools .select-all { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
    .list-tools input[type="checkbox"] { width: 15px; height: 15px; padding: 0; margin: 0; accent-color: var(--accent); cursor: pointer; }
    .move-folder { flex: 1 1 240px; min-width: 150px; }
    .new-record { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); margin-bottom: 10px; }
    .new-record select { min-width: 200px; }
    .new-record input { flex: 1 1 180px; min-width: 140px; }
    .rules-editor { width: 100%; box-sizing: border-box; min-height: 220px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; line-height: 1.5; padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: inherit; }
    .rules-example { margin: 0; padding: 10px; overflow: auto; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); font-size: 12px; }
    .meta-editor { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; background: var(--panel); }
    .meta-editor summary { cursor: pointer; font-size: 12px; color: var(--muted); user-select: none; }
    .meta-editor[open] summary { margin-bottom: 8px; }
    .meta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; margin-bottom: 8px; }
    .meta-editor .field > input { width: 100%; }
    .blk { padding: 4px; border: 1px solid var(--border); border-radius: 4px; margin: 2px 0; cursor: text; }
    .blkcontent { white-space: pre-wrap; font-size: 13px; }
    .blkedit { display: none; width: 100%; min-height: 60px; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 4px; font-family: monospace; }
    header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
    h1 { font-size: 20px; margin: 0; }
    input, select, textarea {
      padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text); font: inherit;
    }
    input:focus, select:focus, textarea:focus { outline: 2px solid color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: 1px; }
    input[type="text"] { width: 320px; }
    button {
      padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text); font: inherit; font-size: 13px;
      cursor: pointer; line-height: 1.3;
    }
    button:hover { background: var(--surface-2); }
    button:active { transform: translateY(1px); }
    button.primary { background: #3b5bdb; border-color: #4c6ef5; color: #fff; }
    button.primary:hover { background: #4c6ef5; }
    button.danger { border-color: #7f3b4b; color: var(--danger); }
    button.danger:hover { background: #4a2b35; }
    button.tab { background: transparent; border-color: transparent; border-bottom: 2px solid transparent; border-radius: 6px 6px 0 0; }
    button.tab:hover { background: var(--surface); }
    button.tab.active { color: var(--accent); border-bottom-color: var(--accent); background: var(--surface); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .blocks { margin-top: 8px; }
    footer { margin-top: 8px; font-size: 12px; color: var(--muted); }
    .settings-modal {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55);
      display: flex; align-items: flex-start; justify-content: center;
      z-index: 100; padding: 48px 16px; overflow: auto;
    }
    .settings-panel {
      width: min(720px, 100%); background: var(--bg); border: 1px solid var(--border);
      border-radius: 12px; padding: 18px 20px 20px; display: grid; gap: 14px;
    }
    .settings-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .settings-head h2 { margin: 0; font-size: 18px; }
    .settings-tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .settings-body { min-height: 330px; }
    .settings-section { display: grid; gap: 8px; margin-bottom: 16px; }
    .settings-section h3 {
      font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--muted); margin: 0;
    }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .row > input[type="text"] { flex: 1 1 280px; }
    .hint { font-size: 12px; color: var(--muted); line-height: 1.45; }
    .mono { font-family: ui-monospace, monospace; font-size: 12px; }
    .list-row { display: flex; gap: 8px; align-items: center; }
    .list-row code { flex: 1; background: var(--surface); padding: 5px 8px; border-radius: 4px; overflow-wrap: anywhere; }
    .registry { display: grid; gap: 3px; max-height: 300px; overflow: auto; }
    .registry-row { display: flex; gap: 8px; font-family: ui-monospace, monospace; font-size: 12px; padding: 2px 0; }
    .registry-row .name { width: 110px; }
    .registry-row .rank { width: 54px; color: var(--muted); }
    .registry-row .nesting { flex: 1; color: var(--muted); }
    .registry-row .id { color: #7f849c; }
    .rule-card { border: 1px solid var(--border); border-radius: 8px; padding: 10px; display: grid; gap: 8px; margin-bottom: 8px; background: color-mix(in srgb, var(--panel) 60%, transparent); }
    .rule-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .field { display: grid; gap: 3px; flex: 1 1 160px; }
    .field > span { font-size: 11px; color: var(--muted); }
    .field > input { width: 100%; }
    .settings-section .row > .field { min-width: 120px; }
    .status-ok { color: var(--ok); }
    .status-bad { color: var(--danger); }
    .error { color: var(--danger); font-size: 12px; }
    .block-node { margin: 8px 0; }
    .block-body { padding: 2px 4px; border-left: 2px solid transparent; }
    .block-node.section > .block-body { border-left-color: var(--accent-2); padding-left: 8px; }
    .block-node.leaf > .block-body { border-left-color: transparent; }
    .block-children { padding-left: 0; margin: 2px 0; }
    .block-node.indent-on > .block-children { padding-left: 18px; border-left: 1px solid var(--surface-2); }
    .block-label { font-size: 11px; color: var(--muted); margin-bottom: 2px; display: flex; gap: 6px; align-items: center; }
    .block-label b { color: var(--text); font-weight: 600; }
    .block-actions { margin-left: auto; display: flex; gap: 3px; opacity: 0; transition: opacity 120ms; }
    .block-node:hover > .block-body > .block-label .block-actions,
    .block-node:focus-within > .block-body > .block-label .block-actions { opacity: 1; }
    button.mini { padding: 1px 7px; font-size: 12px; line-height: 1.3; border-radius: 5px; }
    .composer { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 8px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; background: color-mix(in srgb, var(--panel) 70%, transparent); }
    .composer input { flex: 1 1 220px; }
    .cm-block { background: var(--surface); border-radius: 4px; padding: 4px; min-height: 34px; }
    .cm-block:focus-within { outline: 1px solid color-mix(in srgb, var(--accent) 65%, transparent); outline-offset: 1px; }
    .cm-block .cm-editor { background: transparent; }
    .cm-block .cm-content { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; padding: 2px 0; }
    /* Type-aware surfaces: the raw Markdown stays editable, but the shape of
       the block is visible while writing. */
    .block-body.kind-h1 .cm-block,
    .block-body.kind-h2 .cm-block,
    .block-body.kind-h3 .cm-block { background: transparent; padding: 2px 0; }
    .block-body.kind-h1 .cm-content { font-size: 21px; font-weight: 700; }
    .block-body.kind-h2 .cm-content { font-size: 17px; font-weight: 700; }
    .block-body.kind-h3 .cm-content { font-size: 15px; font-weight: 600; }
    .block-body.kind-quote .cm-block { background: transparent; border-left: 3px solid var(--accent-2); border-radius: 0; padding-left: 8px; }
    .block-body.kind-quote .cm-content { font-style: italic; color: var(--muted); }
    .block-body.kind-code .cm-block { background: #11111b; }
    .block-body.kind-code .cm-content { color: #a6e3a1; }
    .block-body.kind-frontmatter .cm-block { background: transparent; }
    .block-body.kind-frontmatter .cm-content { font-size: 12px; color: var(--muted); }
    .block-body.kind-divider .cm-block { background: transparent; min-height: 22px; }
    .block-body.kind-divider .cm-content { color: var(--muted); text-align: center; }
    .block-body.kind-table .cm-content,
    .block-body.kind-math .cm-content { font-family: ui-monospace, monospace; }
    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;
        --bg: #eff1f5; --panel: #e6e9ef; --surface: #dce0e8; --surface-2: #ccd0da;
        --text: #4c4f69; --muted: #6c6f85; --border: #bcc0cc;
      }
      .card { background: var(--panel); border-color: var(--border); }
      .meta { color: var(--muted); }
      input, select, textarea { background: var(--surface); color: var(--text); border-color: var(--border); }
      .blk { border-color: var(--border); }
      .blkedit { background: var(--surface); color: var(--text); border-color: var(--border); }
      button { background: var(--surface); color: var(--text); border-color: var(--border); }
      button:hover { background: var(--surface-2); }
      .block-body.kind-code .cm-block { background: #e6e9ef; }
      .block-body.kind-code .cm-content { color: #40a02b; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
