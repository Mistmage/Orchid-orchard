    <ellipse cx="32" cy="50" rx="9" ry="6"/>
  </g>
  <circle cx="32" cy="26" r="7" fill="#fde68a"/>
  <circle cx="32" cy="26" r="3" fill="#1e1e2e"/>
</svg>
