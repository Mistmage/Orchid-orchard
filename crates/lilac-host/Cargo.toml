[package]
name = "lilac-host"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Lilac native messaging host (browser <-> record store)."

# Library only: Orchard is the single executable and embeds this host runtime
# (launched by the browser through orchard.exe --host / auto-detection).
[lib]
name = "lilac_host"
path = "src/lib.rs"

[dependencies]
lilac-core = { path = "../lilac-core" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
