<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Lilac Manager</title>
  <link rel="stylesheet" href="popup/popup.css" />
  <style>
    body { width: 100vw; max-width: 1100px; margin: 0 auto; padding: 16px; }
    header { display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 22px; }
    .layout { display: grid; grid-template-columns: 220px 1fr; gap: 16px; margin-top: 12px; }
    nav { display: flex; flex-direction: column; gap: 6px; }
    nav button { text-align: left; }
    main { max-height: 70vh; }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <header>
    <h1>Lilac</h1>
    <div class="actions">
      <button id="saveTab">Save tab</button>
      <button id="saveSelected">Save selected</button>
      <button id="snapshotTab">Snapshot tab</button>
      <button id="openFolder">Open folder</button>
      <button id="changeFolder">Change folder</button>
    </div>
  </header>
  <div class="layout">
    <nav>
      <button data-view="recent" class="active">Recent</button>
      <button data-view="collections">Collections</button>
      <button data-view="tags">Tags</button>
      <button data-view="search">Search</button>
    </nav>
    <div>
      <div id="searchbar" style="display:none; margin-bottom:8px;">
        <input id="q" type="text" placeholder="tag:rust type:page foo" style="width:100%; padding:6px;" />
      </div>
      <main id="list"></main>
      <footer id="status"></footer>
    </div>
  </div>
  <script src="popup/popup.js"></script>
</body>
</html>
